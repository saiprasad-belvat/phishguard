<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhishGuard — Phishing Triage &amp; Awareness Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14;
  --panel:#111826;
  --panel-2:#0E1420;
  --border:#1E2A3A;
  --border-soft:#182233;
  --text:#C7D2E0;
  --text-dim:#8496AC;
  --text-bright:#F1F5FA;
  --accent:#4F8EF7;
  --accent-dim:#2A4A78;
  --safe:#34D399;
  --safe-bg:rgba(52,211,153,0.10);
  --sus:#F5A524;
  --sus-bg:rgba(245,165,36,0.10);
  --mal:#F43F5E;
  --mal-bg:rgba(244,63,94,0.10);
  --crit:#FF5C7A;
  --font-ui:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:10px;
  --sidebar-w:230px;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F3F5F8; --panel:#FFFFFF; --panel-2:#F8FAFC; --border:#E2E8F0; --border-soft:#EDF1F6;
    --text:#2A3444; --text-dim:#64748B; --text-bright:#0F172A;
  }
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);
  min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
html,body{height:100%;}
a{color:inherit;}
button{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---- Shell ---- */
#shell{display:flex;min-height:100%;}
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:var(--panel-2);
  border-right:1px solid var(--border-soft);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:18px 14px;z-index:20;
}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px 8px;}
#sidebar .brand .mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(155deg,var(--accent),#8B5CF6);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
#sidebar .brand .mark svg{width:19px;height:19px;}
#sidebar .brand .name{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--text-bright);letter-spacing:.2px;}
#sidebar .brand .sub{font-size:10px;color:var(--text-dim);margin-top:1px;}
#nav{display:flex;flex-direction:column;gap:2px;margin-top:6px;flex:1;overflow-y:auto;}
.navlink{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
  color:var(--text-dim);font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid transparent;
  text-decoration:none;transition:background .12s,color .12s;
}
.navlink svg{width:16px;height:16px;flex:0 0 auto;opacity:.85;}
.navlink:hover{background:var(--border-soft);color:var(--text-bright);}
.navlink.active{background:var(--accent-dim);color:#DCE8FF;border-color:rgba(79,142,247,0.35);}
#sidebar .foot{padding:10px 8px 2px;font-size:10.5px;color:var(--text-dim);border-top:1px solid var(--border-soft);margin-top:10px;line-height:1.5;}
#sidebar .foot b{color:var(--text);}

#main{flex:1;min-width:0;}
#topbar{
  position:sticky;top:0;z-index:15;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--border-soft);
  display:flex;align-items:center;justify-content:space-between;padding:14px 24px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
}
#topbar .title{font-size:15px;font-weight:700;color:var(--text-bright);}
#topbar .title .crumb{color:var(--text-dim);font-weight:500;font-size:12.5px;display:block;margin-top:1px;font-family:var(--font-mono);}
#topbar .status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-dim);font-family:var(--font-mono);}
#topbar .dot{width:7px;height:7px;border-radius:50%;background:var(--safe);box-shadow:0 0 0 3px var(--safe-bg);}
#menuBtn{display:none;}

#content{padding:22px 24px 60px;max-width:1180px;}

/* ---- Generic UI ---- */
.h1{font-size:21px;font-weight:800;color:var(--text-bright);margin:0 0 4px;letter-spacing:-.2px;}
.lede{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;max-width:640px;line-height:1.55;}
.grid{display:grid;gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:16px;}
.card.pad-lg{padding:20px;}
.stat-card .k{font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--text-bright);}
.stat-card .l{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-top:2px;}
.stat-card{position:relative;overflow:hidden;}
.stat-card .bar{position:absolute;left:0;top:0;bottom:0;width:3px;}

.section-title{font-size:13px;font-weight:700;color:var(--text-bright);margin:28px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title:first-child{margin-top:0;}

table{width:100%;border-collapse:collapse;font-size:12.8px;}
th{text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border-soft);}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border-soft);}
.table-wrap table{min-width:560px;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--border-soft);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.3px;font-family:var(--font-mono);}
.badge.safe{background:var(--safe-bg);color:var(--safe);}
.badge.sus{background:var(--sus-bg);color:var(--sus);}
.badge.mal{background:var(--mal-bg);color:var(--mal);}
.badge.neutral{background:var(--border-soft);color:var(--text-dim);}
.sev{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px;}
.sev.low{background:var(--safe-bg);color:var(--safe);}
.sev.medium{background:var(--sus-bg);color:var(--sus);}
.sev.high{background:rgba(244,63,94,0.12);color:#FB7185;}
.sev.critical{background:var(--mal-bg);color:var(--mal);}

label.field-label{display:block;font-size:11.5px;font-weight:600;color:var(--text-dim);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px;}
input[type=text],input[type=url],input[type=search],textarea,select{
  width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  color:var(--text-bright);padding:10px 12px;font-size:13px;font-family:var(--font-ui);outline:none;
}
textarea{font-family:var(--font-mono);font-size:12.5px;line-height:1.55;resize:vertical;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,142,247,0.15);}
.field{margin-bottom:14px;}
.btn{
  display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#fff;border:none;
  padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;transition:filter .12s, transform .04s;
}
.btn:hover{filter:brightness(1.08);}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:var(--panel-2);color:var(--text-bright);border:1px solid var(--border);}
.btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);}
.btn.danger{background:rgba(244,63,94,0.14);color:#FB7185;border:1px solid rgba(244,63,94,0.3);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

.chip{display:inline-flex;align-items:center;font-size:11.5px;padding:4px 10px;border-radius:100px;background:var(--border-soft);color:var(--text-dim);margin:0 6px 6px 0;font-weight:500;}
.pill-toggle{display:flex;gap:8px;flex-wrap:wrap;}
.pill-toggle button{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;}
.pill-toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

.evidence{
  background:var(--panel-2);border:1px solid var(--border-soft);border-left:3px solid var(--accent);
  border-radius:0 8px 8px 0;padding:12px 14px;margin:10px 0;
}
.evidence.high{border-left-color:#FB7185;}
.evidence.critical{border-left-color:var(--mal);}
.evidence.low{border-left-color:var(--safe);}
.evidence.medium{border-left-color:var(--sus);}
.evidence .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
.evidence .ind{font-weight:700;font-size:13px;color:var(--text-bright);}
.evidence .quote{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);background:var(--bg);border:1px solid var(--border-soft);border-radius:6px;padding:6px 9px;margin:6px 0;overflow-x:auto;}
.evidence .exp{font-size:12.5px;color:var(--text);line-height:1.5;}
.evidence .rec{font-size:12px;color:var(--accent);margin-top:6px;font-weight:500;}

.tag-EDU{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;color:#0B0F14;background:linear-gradient(90deg,#F5A524,#FDE68A);padding:3px 9px;border-radius:5px;margin-bottom:10px;}

.score-ring-wrap{display:flex;align-items:center;gap:18px;}
.score-num{font-family:var(--font-mono);font-size:40px;font-weight:800;color:var(--text-bright);}
.score-sub{color:var(--text-dim);font-size:12px;}
.meter{height:9px;border-radius:6px;background:var(--border-soft);overflow:hidden;margin-top:8px;}
.meter > div{height:100%;border-radius:6px;}

.tree-node{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:0 auto 6px;max-width:420px;text-align:center;}
.tree-node.decision{border-color:var(--accent);}
.tree-arrow{text-align:center;color:var(--text-dim);font-size:18px;margin:2px 0;}
.tree-branches{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.tree-branches .card{flex:1;min-width:170px;max-width:230px;text-align:center;cursor:pointer;border-width:1px;}
.tree-branches .card:hover{border-color:var(--accent);}

.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border-soft);}
.checklist-item:last-child{border-bottom:none;}
.checklist-item input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);}
.checklist-item .t{font-size:13px;color:var(--text);}

.learn-card{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:16px;cursor:pointer;transition:border-color .12s;}
.learn-card:hover{border-color:var(--accent);}
.learn-card h4{margin:0 0 6px;font-size:14px;color:var(--text-bright);}
.learn-card p{margin:0;font-size:12.5px;color:var(--text-dim);line-height:1.5;}

.modal-overlay{position:fixed;inset:0;background:rgba(4,7,12,0.6);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;padding:24px;position:relative;}
.modal .close{position:absolute;top:14px;right:14px;background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:15px;}

.sim-msg{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.65;}
.sim-msg .mh{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-bottom:3px;}
.sim-msg .mh b{color:var(--text);}
.sim-msg .divider{border-top:1px dashed var(--border);margin:10px 0;}

.kbd{font-family:var(--font-mono);background:var(--border-soft);padding:1px 6px;border-radius:4px;font-size:11.5px;}

.empty{text-align:center;padding:40px 20px;color:var(--text-dim);font-size:13px;}

.flag-common{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:12.5px;}
.flag-common:last-child{border-bottom:none;}
.flag-common .bar{flex:1;height:6px;background:var(--border-soft);border-radius:4px;margin:0 10px;overflow:hidden;}
.flag-common .bar>div{height:100%;background:var(--accent);}

.header-table td:first-child{color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;width:150px;white-space:nowrap;}
.header-table td:last-child{font-family:var(--font-mono);font-size:12px;word-break:break-all;}

.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

.domain-tree{font-family:var(--font-mono);font-size:13px;line-height:2.2;}
.domain-tree .lvl{padding:4px 10px;border-radius:6px;display:inline-block;background:var(--border-soft);}
.domain-tree .root{background:var(--mal-bg);color:var(--mal);font-weight:700;}
.domain-tree .arrow{color:var(--text-dim);margin:0 6px;}

@media(max-width:900px){
  :root{--sidebar-w:210px;}
  #sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .18s ease;box-shadow:0 0 40px rgba(0,0,0,.5);}
  #sidebar.open{transform:translateX(0);}
  #main{width:100%;}
  #menuBtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);color:var(--text);cursor:pointer;}
  #content{padding:18px 16px 60px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  #sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19;}
  #sidebar-scrim.show{display:block;}
}
@media print{
  #sidebar,#topbar,.btn-row,#menuBtn{display:none!important;}
  body{background:#fff;color:#111;}
  .card{border:1px solid #ccc;background:#fff;}
}
</style>
</head>
<body>
<div id="shell">
  <div id="sidebar-scrim"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3.5v6C20 16.5 16.5 20.5 12 22c-4.5-1.5-8-5.5-8-10.5v-6L12 2z" fill="#fff" opacity=".95"/><path d="M9 12l2 2 4-4.5" stroke="#0B0F14" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div>
        <div class="name">PHISHGUARD</div>
        <div class="sub">Triage &amp; Awareness Toolkit</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="foot"><b>Educational tool.</b> No emails are sent. No credentials are collected. All simulations are fictional.</div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="menuBtn" aria-label="Menu">☰</button>
        <div class="title"><span id="pageTitle">Dashboard</span><span class="crumb" id="pageCrumb">phishguard / overview</span></div>
      </div>
      <div class="status"><span class="dot"></span> LOCAL ANALYSIS MODE — NO DATA LEAVES YOUR BROWSER</div>
    </div>
    <div id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
/* =====================================================================
   PHISHGUARD — deterministic rule-based phishing triage engine
   Educational / defensive use only. No network calls, no real
   credential collection, no automatic navigation to submitted URLs.
   ===================================================================== */

const STORE_KEYS = { HISTORY:'pg_history', SCORE:'pg_awareness', WEIGHTS:'pg_weights', CHECKLIST:'pg_checklist_state' };

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v? JSON.parse(v): fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* storage unavailable */ }
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){ return prefix + '-' + Date.now().toString(36) + '-' + Math.floor(Math.random()*9999).toString(36); }
function fmtDate(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'2-digit'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function truncate(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+'…': s; }

/* ---------------------------------------------------------------------
   Default configurable weights (Section 53 — configurable scoring)
--------------------------------------------------------------------- */
const DEFAULT_WEIGHTS = {
  urgency:10, authority:10, curiosity:8, fear:12, greed:12,
  credentialRequest:20, sensitiveInfoRequest:20,
  domainMismatch:20, replyToMismatch:15, returnPathMismatch:10,
  suspiciousAttachment:15, dangerousExt:15,
  urlShortener:10, ipUrl:20, homograph:25, typosquat:20, combosquat:18,
  excessiveSubdomain:10, punycode:15, atSymbol:15, encodedChars:8, suspiciousKeywordUrl:8,
  mfaFatigue:20, paymentRequest:15, callbackScam:15, bypassRequest:20,
  fakeForward:8, browserInBrowser:15, deepfake:15, spearContext:6
};
function getWeights(){ return Object.assign({}, DEFAULT_WEIGHTS, loadJSON(STORE_KEYS.WEIGHTS, {})); }
function setWeights(w){ saveJSON(STORE_KEYS.WEIGHTS, w); }

/* ---------------------------------------------------------------------
   Text-pattern detectors — each returns an array of findings:
   { type, label, severity, evidence, explanation, recommendation }
--------------------------------------------------------------------- */
function findMatches(text, patterns){
  const out = [];
  const lower = text.toLowerCase();
  for(const p of patterns){
    const re = p.re;
    re.lastIndex = 0;
    let m;
    while((m = re.exec(text)) !== null){
      out.push(m[0]);
      if(!re.global) break;
      if(out.length > 4) break;
    }
  }
  return out;
}

function detectUrgency(text){
  const patterns = [
    {re:/\b(immediately|urgent(ly)?|right away|as soon as possible|act now|final (notice|warning)|last chance)\b/gi},
    {re:/within\s+\d+\s*(minutes?|hours?|days?)/gi},
    {re:/(account|access|service)\s+(will\s+be\s+)?(locked|suspended|terminated|closed|disabled)/gi},
    {re:/expir(es|ing|ed)\s+(today|soon|in\s+\d+)/gi}
  ];
  const hits = findMatches(text, patterns);
  if(!hits.length) return null;
  return { type:'urgency', label:'Urgency / Artificial Time Pressure', severity:'high',
    evidence: hits.slice(0,3).join(' … '),
    explanation:'The message manufactures a deadline or threatens a negative consequence to pressure the reader into acting quickly, which reduces the chance they will pause and verify.',
    recommendation:'Pause. Legitimate organizations rarely demand action within minutes — verify independently before responding.' };
}
function detectAuthority(text){
  const patterns=[{re:/\b(CEO|CFO|COO|chief executive|president|managing director|IT security|IT department|IT support|help ?desk|government|federal|internal revenue|tax authority|law enforcement|police department|compliance (team|department)|legal department|human resources|HR department)\b/gi}];
  const hits = findMatches(text, patterns);
  if(!hits.length) return null;
  return { type:'authority', label:'Authority Impersonation', severity:'medium',
    evidence: [...new Set(hits)].slice(0,3).join(', '),
    explanation:'The message invokes a position of authority (executive, IT, government, legal) to discourage questioning and encourage compliance.',
    recommendation:'Verify the request through a known, independently obtained contact for that person or department — not any contact info in the message itself.' };
}
function detectCuriosity(text){
  const patterns=[{re:/\b(you won'?t believe|see what .*(said|posted)|confidential (document|file|report)|leaked|who (viewed|said)|secret files?|shared a document with you)\b/gi}];
  const hits = findMatches(text, patterns);
  if(!hits.length) return null;
  return { type:'curiosity', label:'Curiosity Trigger', severity:'medium',
    evidence: hits.slice(0,2).join(' … '),
    explanation:'The message dangles intriguing or gossip-like content to prompt an impulsive click before critical thinking kicks in.',
    recommendation:'Treat unsolicited "confidential" or gossip-style content as bait — confirm with the purported sender through another channel.' };
}
function detectFear(text){
  const patterns=[{re:/\b(account (has been|is) (compromised|hacked)|unauthorized (access|login|activity)|unusual activity|suspicious login|legal action|will be (terminated|reported|fined)|permanently (deleted|closed))\b/gi}];
  const hits = findMatches(text, patterns);

const TEXT_DETECTORS = [
  detectUrgency, detectAuthority, detectCuriosity, detectFear, detectGreed,
  detectCredentialRequest, detectSensitiveInfoRequest, detectMFAFatigue,
  detectPaymentRequest, detectCallbackScam, detectBypassRequest, detectFakeForward,
  detectBrowserInBrowser, detectDeepfake, detectDangerousAttachment, detectSpearContext

/* ---------------------------------------------------------------------
   Sender / header identity analysis (Sections 7–9)
--------------------------------------------------------------------- */
const KNOWN_BRANDS = ['microsoft','paypal','amazon','google','apple','netflix','bankofamerica','chase','dhl','fedex','ebay','facebook','instagram','linkedin','dropbox','irs','hmrc','wellsfargo','americanexpress','coinbase','adobe'];

function domainOf(addr){
  if(!addr) return '';
  const m = String(addr).match(/@([\w.\-]+)/);
  return m? m[1].toLowerCase() : String(addr).toLowerCase().trim();
}
function rootDomainOf(host){
  if(!host) return '';
  const parts = host.toLowerCase().replace(/^www\./,'').split('.');
  if(parts.length<=2) return parts.join('.');
  return parts.slice(-2).join('.');
}
function detectSenderMismatch(displayName, fromAddr){
  if(!displayName || !fromAddr) return null;
  const dn = displayName.toLowerCase();
  const fromDomain = rootDomainOf(domainOf(fromAddr));
  const claimedBrand = KNOWN_BRANDS.find(b => dn.includes(b));
  if(claimedBrand && !fromDomain.includes(claimedBrand)){
    return { type:'domainMismatch', label:'Sender Display-Name / Domain Mismatch', severity:'high',
      evidence: `Display name "${displayName}" implies "${claimedBrand}", but the sending address domain is "${fromDomain}"`,
      explanation:'A trusted-looking display name does not guarantee that the underlying email address belongs to that organization. Mail clients render the display name, which anyone can set arbitrarily.',
      recommendation:'Always check the full email address, not just the display name, before trusting a message.' };
  }
  return null;
}
function detectReplyToMismatch(fromAddr, replyTo, returnPath){
  const findings = [];
  const fromDomain = rootDomainOf(domainOf(fromAddr));
  if(replyTo && rootDomainOf(domainOf(replyTo)) && rootDomainOf(domainOf(replyTo)) !== fromDomain){
    findings.push({ type:'replyToMismatch', label:'Reply-To Routing Mismatch', severity:'high',
      evidence: `From domain "${fromDomain}" vs Reply-To domain "${rootDomainOf(domainOf(replyTo))}"`,
      explanation:'Replies would be routed to a different domain than the one the message claims to come from — a common technique to intercept responses while impersonating a trusted sender.',
      recommendation:'Treat a Reply-To/From mismatch as a strong warning sign. Verify through a separately obtained contact, not by replying.' });
  }
  if(returnPath && rootDomainOf(domainOf(returnPath)) && rootDomainOf(domainOf(returnPath)) !== fromDomain){
    findings.push({ type:'returnPathMismatch', label:'Return-Path Mismatch', severity:'medium',
      evidence: `From domain "${fromDomain}" vs Return-Path domain "${rootDomainOf(domainOf(returnPath))}"`,
      explanation:'The Return-Path (used for bounce handling) points to a different domain than the visible sender, which can indicate the message was relayed through infrastructure unrelated to the claimed sender.',
      recommendation:'Return-Path differences alone are not conclusive (mailing platforms often differ legitimately) but should be combined with other evidence.' });
  }
  return findings;
}

/* ---------------------------------------------------------------------
   URL / domain analysis (Sections 10–15)
--------------------------------------------------------------------- */
const SHORTENERS = ['bit.ly','tinyurl.com','t.co','goo.gl','ow.ly','is.gd','buff.ly','rebrand.ly','cutt.ly','shorturl.at'];
const SUSPICIOUS_URL_KEYWORDS = ['login','verify','secure','update','account','confirm','signin','support','billing','unlock','validate'];

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp = Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}

function analyzeSingleUrl(rawUrl){
  const result = { raw: rawUrl, valid:false, findings:[], parts:{} };
  let candidate = rawUrl.trim();
  if(!/^[a-zA-Z]+:\/\//.test(candidate)) candidate = 'http://' + candidate;
  let u;
  try{ u = new URL(candidate); result.valid = true; }
  catch(e){ result.findings.push({type:'parseError', label:'Unparsable URL', severity:'medium',
      evidence: rawUrl, explanation:'The URL could not be parsed with standard rules, which itself can indicate obfuscation.', recommendation:'Do not click. Inspect manually or discard.'});
    return result; }

  const host = u.hostname.toLowerCase();
  const root = rootDomainOf(host);
  const labels = host.split('.');
  result.parts = { scheme:u.protocol.replace(':',''), hostname:host, port:u.port||'(default)', path:u.pathname||'/', query:u.search||'(none)', rootDomain: root, subdomainChain: labels.length>2? labels.slice(0,-2).join('.') : '(none)' };

  // scheme
  if(u.protocol === 'http:'){
    result.findings.push({type:'insecureScheme', label:'Non-HTTPS Link', severity:'low', evidence:'http:// (unencrypted)',
      explanation:'The link uses unencrypted HTTP rather than HTTPS. Most legitimate services now use HTTPS by default.', recommendation:'Treat plain-HTTP login or verification links with extra caution.'});
  }
  // IP address host
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(host) || host.includes(':')){
    result.findings.push({type:'ipUrl', label:'IP-Address URL', severity:'critical', evidence: host,
      explanation:'The link points directly to a numeric IP address instead of a named domain — legitimate organizations essentially never link to raw IPs for user-facing services.', recommendation:'Do not visit. This is a strong phishing/malware indicator.'});
  }
  // @ symbol trick
  if(rawUrl.includes('@')){
    result.findings.push({type:'atSymbol', label:'"@" Symbol in URL', severity:'high', evidence: rawUrl,
      explanation:'Everything before an "@" in a URL is typically ignored for host resolution, letting attackers show a trusted-looking prefix while the browser navigates to the domain after the "@".', recommendation:'Read the actual hostname (after the "@") — never trust the text before it.'});
  }
  // punycode / homograph
  if(host.includes('xn--')){
    result.findings.push({type:'punycode', label:'Punycode-Encoded Hostname', severity:'high', evidence: host,
      explanation:'The hostname uses Punycode encoding (xn--), often used to represent internationalized characters that can visually mimic Latin letters (a homograph attack).', recommendation:'Copy the domain into a Punycode decoder and compare it carefully to the real brand domain before trusting it.'});
  } else if(/[^\x00-\x7F]/.test(host)){
    result.findings.push({type:'homograph', label:'Non-ASCII Characters in Hostname', severity:'critical', evidence: host,
      explanation:'The hostname contains non-ASCII characters. These can be visually near-identical to standard Latin letters (e.g. Cyrillic "а" vs Latin "a"), a technique called a homograph or IDN spoofing attack.', recommendation:'Do not trust this domain visually. Verify its true identity via Punycode / certificate details before proceeding.'});
  }
  // shortener
  if(SHORTENERS.some(s => host === s || host.endsWith('.'+s))){
    result.findings.push({type:'urlShortener', label:'URL Shortener', severity:'medium', evidence: host,
      explanation:'Shortened URLs hide the true destination until clicked, which is frequently used to disguise malicious links.', recommendation:'Use a link-expanding tool to reveal the real destination before clicking, or avoid entirely.'});
  }
  // excessive subdomains / subdomain trap
  if(labels.length >= 5){
    result.findings.push({type:'excessiveSubdomain', label:'Excessive / Deceptive Subdomains', severity:'high',
      evidence: host, explanation:'The hostname has an unusually long chain of subdomains. Attackers often stack brand-like words as subdomains (e.g. "login.example-security.com.verify-user.example.net") so the real, registrable domain is pushed out of view.',
      recommendation:`Read domains right-to-left: the true registrable domain here is "${root}", not the brand-sounding text earlier in the string.` });
  }
  // combosquat / brand-in-subdomain confusion
  const brandInHost = KNOWN_BRANDS.find(b => host.includes(b));
  if(brandInHost && root !== `${brandInHost}.com` && !root.startsWith(brandInHost)){
    result.findings.push({type:'combosquat', label:'Brand Name Combined With Unrelated Domain (Combosquatting)', severity:'high',
      evidence: host, explanation:`The hostname contains the brand term "${brandInHost}" but the actual registrable domain is "${root}", which is unrelated to that brand.`,
      recommendation:'Do not assume a domain is legitimate just because it contains a familiar brand name anywhere in the string.' });
  }
  // typosquat against known brands — check whole root label and each hyphen-separated token
  const mainLabel = root.replace(/\.[a-z]+$/,'');
  const tokens = [mainLabel, ...mainLabel.split('-')].filter(t=>t.length>3);
  typoLoop:
  for(const brand of KNOWN_BRANDS){
    const brandDomain = brand + '.com';
    if(root === brandDomain) break; // legitimate exact match, stop checking
    for(const token of tokens){
      const dist = levenshtein(token, brand);
      if(dist>0 && dist<=2){
        result.findings.push({type:'typosquat', label:'Possible Typosquatting Domain', severity:'high',
          evidence:`"${token}" in domain "${root}" closely resembles "${brandDomain}" (edit distance ${dist})`,
          explanation:'Part of the domain is textually very close to a well-known brand name, differing by a small character substitution, omission, duplication, or transposition — a hallmark of typosquatting.',
          recommendation:'Similarity alone is not proof of malice, but treat it as a strong risk indicator requiring independent verification before trusting the site.' });
        break typoLoop;
      }
    }
  }
  // suspicious keywords in path/host
  const kw = SUSPICIOUS_URL_KEYWORDS.filter(k => host.includes(k) || (u.pathname||'').toLowerCase().includes(k));
  if(kw.length){
    result.findings.push({type:'suspiciousKeywordUrl', label:'Suspicious Keywords in URL', severity:'low', evidence: kw.join(', '),
      explanation:'The URL contains words commonly used in phishing links to imply an account or security action is required.', recommendation:'Combine with other evidence — these words alone do not confirm phishing, but warrant a closer look.'});
  }
  // encoded characters
  if(/%[0-9a-fA-F]{2}/.test(rawUrl) && (rawUrl.match(/%[0-9a-fA-F]{2}/g)||[]).length>=3){
    result.findings.push({type:'encodedChars', label:'Heavily Percent-Encoded URL', severity:'low', evidence: rawUrl,
      explanation:'Multiple percent-encoded characters can be used to obscure the true content of a URL from a quick visual scan.', recommendation:'Decode the URL fully before trusting it.'});
  }
  return result;
}

function extractUrls(text){
  const re = /\bhttps?:\/\/[^\s<>"')\]]+|(?:\bwww\.[^\s<>"')\]]+)/gi;
  return [...new Set((text.match(re)||[]))];
}

/* ---------------------------------------------------------------------
   Raw email header parsing (Section 9)
--------------------------------------------------------------------- */
function parseHeaders(raw){
  const fields = {From:'',To:'',['Reply-To']:'',['Return-Path']:'',Received:[],['Authentication-Results']:'',SPF:'',DKIM:'',DMARC:'',['Message-ID']:'',Date:''};
  const lines = raw.split(/\r?\n/);
  let currentKey = null;
  for(const line of lines){
    const m = line.match(/^([A-Za-z\-]+):\s*(.*)$/);
    if(m){
      const key = m[1].trim();
      const norm = Object.keys(fields).find(k => k.toLowerCase() === key.toLowerCase());
      if(norm){
        if(norm==='Received') fields.Received.push(m[2].trim());
        else fields[norm] = (fields[norm] ? fields[norm]+' ' : '') + m[2].trim();
        currentKey = norm;
      } else { currentKey = null; }
    } else if(currentKey && /^\s+/.test(line) && line.trim()){
      if(currentKey==='Received') fields.Received[fields.Received.length-1] += ' ' + line.trim();
      else fields[currentKey] += ' ' + line.trim();
    }
  }
  // pull SPF/DKIM/DMARC out of Authentication-Results if not separately present
  const ar = fields['Authentication-Results'];
  if(ar){
    if(!fields.SPF){ const m=ar.match(/spf=(\w+)/i); if(m) fields.SPF = m[1]; }
    if(!fields.DKIM){ const m=ar.match(/dkim=(\w+)/i); if(m) fields.DKIM = m[1]; }
    if(!fields.DMARC){ const m=ar.match(/dmarc=(\w+)/i); if(m) fields.DMARC = m[1]; }
  }
  return fields;
}
function authVerdict(val){
  if(!val) return {text:'Insufficient header evidence.', cls:'neutral'};
  const v = val.toLowerCase();
  if(v.includes('pass')) return {text:'Pass', cls:'safe'};
  if(v.includes('fail')) return {text:'Fail', cls:'mal'};
  if(v.includes('none') || v.includes('neutral') || v.includes('softfail')) return {text: val, cls:'sus'};
  return {text: val, cls:'neutral'};
}

<script>
"use strict";
/* ---------------------------------------------------------------------

--------------------------------------------------------------------- */
function classifyScore(score){
  if(score>=75) return {label:'MALICIOUS', cls:'mal', tier:'Critical'};
  if(score>=50) return {label:'SUSPICIOUS', cls:'sus', tier:'High'};
  if(score>=25) return {label:'SUSPICIOUS', cls:'sus', tier:'Medium'};
  return {label:'SAFE', cls:'safe', tier:'Low'};
}
const SEVERITY_POINTS_KEY = {low:0.4, medium:0.7, high:1, critical:1.3};

function runAnalysis(input){
  // input: {displayName, from, replyTo, returnPath, subject, body, urls(extra), headers(raw)}
  const weights = getWeights();
  const text = [input.subject||'', input.body||''].join('\n\n');
  const findings = [];

        explanation:'One or more authentication mechanisms failed, meaning the sending server was not authorized or the message content/signature did not validate as expected for this domain.',
        recommendation:'Treat authentication failures as a significant warning sign, though not proof on their own — combine with other evidence.'});

    const base = weights.hasOwnProperty(f.type) ? weights[f.type] : (weightKeyMap[f.type] ?? 6);

  score = Math.round(clamp(score, 0, 130));

  if(findings.length===0) confidence = 'Low-risk based on the indicators analyzed — no red flags were detected in the submitted text, but absence of evidence is not proof of safety.';
  else if(findings.length<=2) confidence = 'Assessment based on a small number of detected indicators — treat as a starting point, not a final verdict.';
  else confidence = 'Assessment based on multiple corroborating indicators, which increases confidence in this classification.';

  const commonFlagCounts = {};
  findings.forEach(f => { commonFlagCounts[f.label] = (commonFlagCounts[f.label]||0)+1; });

  return {
    id: uid('RPT'), timestamp: Date.now(),
    input, score, classification, confidence,
    findings, urlResults, headerFields,
    action: classification.label==='MALICIOUS' ? 'BLOCK & ESCALATE' : classification.label==='SUSPICIOUS' ? 'WARN USER — VERIFY' : 'NO ACTION REQUIRED (STAY VIGILANT)'
  };
}

function saveReportToHistory(report){
  const hist = loadJSON(STORE_KEYS.HISTORY, []);
  hist.unshift({
    id: report.id, date: report.timestamp,
    sender: report.input.displayName || '(unspecified)',
    from: report.input.from || '',
    subject: report.input.subject || '(no subject)',
    risk: report.classification.label,
    score: report.score,
    action: report.action,
    flags: report.findings.map(f=>f.label),
    full: report
  });
  saveJSON(STORE_KEYS.HISTORY, hist.slice(0,300));
}
function getHistory(){ return loadJSON(STORE_KEYS.HISTORY, []); }
function deleteHistoryItem(id){ saveJSON(STORE_KEYS.HISTORY, getHistory().filter(h=>h.id!==id)); }
function clearHistory(){ saveJSON(STORE_KEYS.HISTORY, []); }

/* ---------------------------------------------------------------------
   Awareness score (simulations)
--------------------------------------------------------------------- */
function getAwareness(){ return loadJSON(STORE_KEYS.SCORE, {points:0, attempts:0, correct:0}); }
function addAwareness(points, correct){
  const a = getAwareness();
  a.points += points; a.attempts += 1; if(correct) a.correct += 1;
  saveJSON(STORE_KEYS.SCORE, a);
  return a;
}
function awarenessLevel(points){
  if(points>=300) return 'Advanced';
  if(points>=150) return 'Practiced';
  if(points>=50) return 'Developing';
  return 'Beginner';
}

function updateChecklistVerdict(){
  const state = loadJSON(STORE_KEYS.CHECKLIST, {});
  const checked = CHECKLIST_ITEMS.map((_,i)=>!!state[i]).filter(Boolean).length;
  const total = CHECKLIST_ITEMS.length;
  const pct = checked/total;
  let verdict, cls;
  if(pct===1){ verdict='All checks pass. Risk appears low based on this checklist — this is a screening aid, not a guarantee.'; cls='safe'; }
  else if(pct>=0.6){ verdict='Most checks pass, but unresolved items remain. Proceed cautiously and verify the outstanding concerns before acting.'; cls='sus'; }
  else { verdict='Multiple checks failed. Treat this message as high risk: do not click links, reply, or act on any request until independently verified.'; cls='mal'; }
  const el = document.getElementById('checklistVerdict');
  if(el) el.innerHTML = `<div style="display:flex;align-items:center;gap:12px;"><span class="badge ${cls}">${checked}/${total} checks passed</span><span style="font-size:12.5px;color:var(--text-dim)">${verdict}</span></div>`;
}

/* ---------------- TRIAGE DECISION TREE ---------------- */
const TREE_STEPS = [
  {key:'sender', q:'Does the sender / header analysis show a domain, Reply-To, or Return-Path mismatch?', yesNext:'risk_high', noNext:'url'},
  {key:'url', q:'Does the URL / domain analysis reveal a suspicious, shortened, IP-based, or lookalike link?', yesNext:'risk_high', noNext:'content'},
  {key:'content', q:'Does the message content contain urgency, fear, authority, or a request for credentials/payment?', yesNext:'triggers', noNext:'attach'},
  {key:'triggers', q:'Are multiple cognitive triggers combined with a sensitive request (credentials, payment, bypass)?', yesNext:'risk_critical', noNext:'risk_medium'},
  {key:'attach', q:'Is there an unexpected or risky attachment (.exe, .js, .html, .zip, etc.)?', yesNext:'risk_high', noNext:'risk_low'}
];
const TREE_OUTCOMES = {
  risk_low:{label:'SAFE', cls:'safe', action:'Close — no immediate action required. Stay vigilant.'},
  risk_medium:{label:'SUSPICIOUS', cls:'sus', action:'Warn User — flag the message and verify before any further action.'},
  risk_high:{label:'SUSPICIOUS', cls:'sus', action:'Warn User — strong indicators present. Verify independently and consider reporting.'},
  risk_critical:{label:'MALICIOUS', cls:'mal', action:'Block & Escalate — report to security immediately and do not interact further.'}
};
function PAGE_triage(){
  return `
  <div class="h1">Triage Decision Tree</div>
  <p class="lede">Walk through the same logic PhishGuard's engine applies, one question at a time, to reach a triage outcome.</p>
  <div id="treeRoot"></div>
  `;
}
function renderTreeStep(stepKey){
  if(TREE_OUTCOMES[stepKey]){
    const o = TREE_OUTCOMES[stepKey];
    return `
    <div class="tree-node decision"><b>Incoming Suspicious Message</b></div>
    <div class="tree-arrow">↓</div>
    <div class="card pad-lg" style="max-width:480px;margin:0 auto;text-align:center;">
      <div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Outcome</div>
      <div style="margin-bottom:10px;">${riskBadge(o.label)}</div>
      <p style="font-size:12.5px;color:var(--text-dim);">${o.action}</p>
      <button class="btn secondary" id="btnTreeRestart" style="margin-top:12px;">Restart</button>
    </div>`;
  }
  const step = TREE_STEPS.find(s=>s.key===stepKey) || TREE_STEPS[0];
  return `
  <div class="tree-node decision"><b>Incoming Suspicious Message</b></div>
  <div class="tree-arrow">↓</div>
  <div class="card pad-lg" style="max-width:520px;margin:0 auto;text-align:center;">
    <p style="font-size:13.5px;color:var(--text-bright);margin:0 0 4px;">${escapeHtml(step.q)}</p>
    <div class="tree-branches">
      <div class="card" data-tree-go="${step.yesNext}"><b style="color:var(--mal)">YES</b></div>
      <div class="card" data-tree-go="${step.noNext}"><b style="color:var(--safe)">NO</b></div>
    </div>
  </div>`;
}

  currentSimState = {queueId:simId, answered:false};
  return `
  <div class="modal-overlay" id="simOverlay">
    <div class="modal">
      <button class="close" id="simClose">✕</button>
      <span class="tag-EDU">EDUCATIONAL SIMULATION — FICTIONAL CONTENT</span>
      <div class="sim-msg">
        <div class="mh"><b>From:</b> ${escapeHtml(s.from)}</div>
        <div class="mh"><b>Subject:</b> ${escapeHtml(s.subject)}</div>
        <div class="divider"></div>
        ${escapeHtml(s.body).split('\n').map(l=>l||'<br>').join('<br>')}
      </div>
      <div class="section-title" style="margin-top:20px;">How would you classify this message?</div>
      <div class="pill-toggle" id="simChoices">
        <button data-choice="SAFE">SAFE</button>
        <button data-choice="SUSPICIOUS">SUSPICIOUS</button>
        <button data-choice="MALICIOUS">MALICIOUS</button>
      </div>
      <div id="simFeedback"></div>
    </div>
  </div>`;
}
function handleSimChoice(simId, choice){
  const s = SIMULATIONS.find(x=>x.id===simId);
  if(!s || currentSimState.answered) return;
  currentSimState.answered = true;
  const correct = choice === s.classification;
  const pts = correct ? 10 : 3;
  addAwareness(pts, correct);
  document.querySelectorAll('#simChoices button').forEach(b=>{
    b.disabled = true;
    if(b.dataset.choice===s.classification) b.classList.add('active');
  });
  document.getElementById('simFeedback').innerHTML = `
    <div class="evidence ${correct?'low':'high'}" style="margin-top:14px;">
      <div class="row1"><span class="ind">${correct? '✓ Correct — this is '+s.classification : '✗ Not quite — the correct classification is '+s.classification}</span><span class="chip">+${pts} pts</span></div>
      <div class="exp"><b>Why:</b> ${escapeHtml(s.lesson)}</div>
      <div style="margin-top:10px;font-size:12px;color:var(--text-dim);"><b style="color:var(--text)">Red flags:</b> ${s.flags.map(f=>`<span class="chip">${escapeHtml(f)}</span>`).join('')}</div>
    </div>
    <div class="btn-row"><button class="btn secondary" id="simCloseBottom">Close</button></div>
  `;
}

/* ---------------- REPORTS / HISTORY ---------------- */
function PAGE_reports(){
  const hist = getHistory();
  return `
  <div class="h1">Analysis History &amp; Reports</div>
  <p class="lede">All analyses are stored locally in your browser only. Nothing here is uploaded or shared.</p>
  <div class="field" style="max-width:320px;"><input type="search" id="histSearch" placeholder="Search sender or subject…"></div>
  ${hist.length===0 ? `<div class="card empty">No saved analyses yet. Run the Analyzer to build history.</div>` : `
  <div class="table-wrap"><table><thead><tr><th>Date</th><th>Sender</th><th>Subject</th><th>Risk</th><th>Score</th><th>Action</th><th></th></tr></thead>
  <tbody id="histBody">${hist.map(h=>renderHistRow(h)).join('')}</tbody></table></div>
  <div class="btn-row"><button class="btn danger" id="btnClearHistory">Clear All History</button></div>
  `}
  `;
}
function renderHistRow(h){
  return `<tr data-open-report="${h.id}">
    <td style="white-space:nowrap;color:var(--text-dim);font-family:var(--font-mono);font-size:11.5px;">${fmtDate(h.date)}</td>
    <td>${escapeHtml(truncate(h.sender,24))}</td>
    <td>${escapeHtml(truncate(h.subject,30))}</td>
    <td>${riskBadge(h.risk)}</td>
    <td style="font-family:var(--font-mono)">${h.score}</td>
    <td style="color:var(--text-dim);font-size:11.5px;">${escapeHtml(h.action)}</td>
    <td><button class="btn ghost" style="padding:5px 10px;font-size:11px;" data-del-report="${h.id}">Delete</button></td>
  </tr>`;
}
function reportModal(reportId){
  const hist = getHistory();
  const item = hist.find(h=>h.id===reportId);
  if(!item) return '';
  return `
  <div class="modal-overlay" id="reportOverlay">
    <div class="modal" style="max-width:760px;">
      <button class="close" id="reportClose">✕</button>
      <div class="h1" style="font-size:17px;">Report ${item.id}</div>
      <p class="lede" style="margin-bottom:10px;">${fmtDate(item.date)} · From: ${escapeHtml(item.from||item.sender)}</p>
      ${renderReportBlock(item.full, {hideActions:false})}
    </div>
  </div>`;
}

/* ---------------- LEARNING CENTER ---------------- */
function PAGE_learning(){
  return `
  <div class="h1">Awareness Learning Center</div>
  <p class="lede">Reference cards covering the major phishing techniques and how to recognize them.</p>
  <div class="grid grid-3">
    ${LEARNING_CARDS.map((c,i)=>`
      <div class="learn-card" data-open-learn="${i}">
        <h4>${escapeHtml(c.title)}</h4>
        <p>${escapeHtml(truncate(c.def,110))}</p>
      </div>`).join('')}
  </div>
  `;
}
function learnModal(i){

  if(!c) return '';
  return `
  <div class="modal-overlay" id="learnOverlay">
    <div class="modal">
      <button class="close" id="learnClose">✕</button>
      <div class="h1" style="font-size:18px;">${escapeHtml(c.title)}</div>
      <p style="font-size:13px;color:var(--text);line-height:1.6;">${escapeHtml(c.def)}</p>
      <div class="section-title">Example</div>
      <div class="evidence medium"><div class="exp">${escapeHtml(c.example)}</div></div>
      <div class="section-title">Red Flags</div>
      <div>${c.flags.map(f=>`<span class="chip">${escapeHtml(f)}</span>`).join('')}</div>
      <div class="section-title">What To Do</div>
      <p style="font-size:12.5px;color:var(--text-dim);line-height:1.6;">${escapeHtml(c.action)}</p>

/* ---------------- SETTINGS / ABOUT ---------------- */
function PAGE_settings(){
  const w = getWeights();
  return `
  <div class="h1">Settings &amp; About</div>
  <p class="lede">Configure scoring weights and review the ethical boundaries this tool operates within.</p>

  <div class="section-title">Scoring Weights</div>
  <div class="card pad-lg">
    <p style="font-size:12px;color:var(--text-dim);margin:0 0 14px;">Adjust how heavily each indicator contributes to the overall risk score (higher = more weight). Changes apply to future analyses.</p>
    <div class="grid grid-3" id="weightGrid">
      ${Object.keys(w).map(k=>`
        <div class="field"><label class="field-label">${escapeHtml(k)}</label><input type="text" inputmode="numeric" data-weight-key="${k}" value="${w[k]}"></div>
      `).join('')}
    </div>
    <div class="btn-row">
      <button class="btn" id="btnSaveWeights">Save Weights</button>
      <button class="btn ghost" id="btnResetWeights">Reset to Defaults</button>
    </div>
  </div>

  <div class="section-title">Data</div>
  <div class="card">
    <p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">All analysis history, awareness score, and checklist state are stored only in this browser's local storage. Clearing it removes everything.</p>
    <div class="btn-row" style="margin-top:0;">
      <button class="btn danger" id="btnResetAll">Reset All Local Data</button>
    </div>
  </div>

  <div class="section-title">About PhishGuard</div>
  <div class="card">
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.7;margin:0 0 10px;">
      PhishGuard is an educational, defensive phishing-triage and awareness toolkit. It analyzes user-submitted, fictional or already-received text using deterministic, local rules — it does not send messages, harvest credentials, execute attachments, or automatically visit URLs.
    </p>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.7;margin:0 0 10px;"><b style="color:var(--text)">This tool never:</b> sends phishing emails · collects real credentials · creates credential-harvesting pages · executes attachments · automatically opens submitted URLs · attacks third-party systems · impersonates real individuals.
    </p>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.7;margin:0;"><b style="color:var(--text)">Limitations:</b> classification is based on deterministic keyword and structural heuristics, not machine learning or live threat intelligence. It is a triage aid for awareness and practice, not a certified security product or a replacement for a human analyst.</p>
  </div>
  `;
}

const PAGES = {
  dashboard: PAGE_dashboard, analyzer: PAGE_analyzer, urlscanner: PAGE_urlscanner,
  headers: PAGE_headers, checklist: PAGE_checklist, triage: PAGE_triage,
  simulations: PAGE_simulations, reports: PAGE_reports, learning: PAGE_learning, settings: PAGE_settings
};

/* =====================================================================
   AFTER-RENDER WIRING (event listeners per page)
   ===================================================================== */
function afterRender(routeId){
  if(routeId==='analyzer'){
    document.getElementById('btnAnalyze').onclick = runAndShowAnalysis;
    document.getElementById('btnDemo').onclick = fillAnalyzerDemo;
    document.getElementById('btnClearForm').onclick = ()=>{ ['in_displayName','in_from','in_replyTo','in_returnPath','in_subject','in_body','in_urls','in_headers'].forEach(id=>document.getElementById(id).value=''); document.getElementById('analysisResult').innerHTML=''; };
  }
  if(routeId==='urlscanner'){
    document.getElementById('btnScanUrls').onclick = ()=>{
      const raw = document.getElementById('urlInput').value;
      const urls = raw.split('\n').map(s=>s.trim()).filter(Boolean);
      document.getElementById('urlResults').innerHTML = renderUrlAnalysis(urls);
    };
    document.getElementById('btnUrlDemo').onclick = ()=>{ document.getElementById('urlInput').value = 'https://login.example-secure-check.com.verify-user.example.net/session\nhttp://amaz0n-orders.com/review\nhttps://bit.ly/3xample'; };
  }
  if(routeId==='headers'){
    document.getElementById('btnParseHeaders').onclick = ()=>{
      const raw = document.getElementById('headerInput').value;
      document.getElementById('headerResults').innerHTML = renderHeaderResults(parseHeaders(raw));
    };
    document.getElementById('btnHeaderDemo').onclick = ()=>{
      document.getElementById('headerInput').value = 'From: IT Security <security@example.com>\nReply-To: support@example-other.com\nReturn-Path: bounce@mail-relay.net\nAuthentication-Results: mx.example.com; spf=fail smtp.mailfrom=example-other.com; dkim=fail; dmarc=fail\nMessage-ID: <abc123@example.com>\nDate: Mon, 21 Sep 2026 09:00:00 +0000';
    };
  }
  if(routeId==='checklist'){
    updateChecklistVerdict();
    document.querySelectorAll('[data-cl-idx]').forEach(cb=>{
      cb.onchange = ()=>{
        const state = loadJSON(STORE_KEYS.CHECKLIST, {});
        state[cb.dataset.clIdx] = cb.checked;
        saveJSON(STORE_KEYS.CHECKLIST, state);
        updateChecklistVerdict();
      };
    });
  }
  if(routeId==='triage'){
    document.getElementById('treeRoot').innerHTML = renderTreeStep(TREE_STEPS[0].key);
    wireTree();
  }
  if(routeId==='reports'){
    document.getElementById('histSearch').oninput = (e)=>{
      const q = e.target.value.toLowerCase();
      const filtered = getHistory().filter(h => h.sender.toLowerCase().includes(q) || h.subject.toLowerCase().includes(q));
      document.getElementById('histBody').innerHTML = filtered.map(renderHistRow).join('') || `<tr><td colspan="7" class="empty">No matches.</td></tr>`;
      wireHistRows();
    };
    const clearBtn = document.getElementById('btnClearHistory');
    if(clearBtn) clearBtn.onclick = ()=>{ if(confirm('Clear all saved analyses? This cannot be undone.')){ clearHistory(); router(); } };
    wireHistRows();
  }
  if(routeId==='settings'){
    document.getElementById('btnSaveWeights').onclick = ()=>{
      const w = {};
      document.querySelectorAll('[data-weight-key]').forEach(inp=>{ w[inp.dataset.weightKey] = parseFloat(inp.value)||0; });
      setWeights(w);
      alert('Weights saved. They will apply to the next analysis.');
    };
    document.getElementById('btnResetWeights').onclick = ()=>{ setWeights(DEFAULT_WEIGHTS); router(); };
    document.getElementById('btnResetAll').onclick = ()=>{
      if(confirm('This will erase all local history, awareness score, and settings. Continue?')){
        Object.values(STORE_KEYS).forEach(k=>localStorage.removeItem(k));
        router();
      }
    };
  }

  // global: dashboard/reports row click -> open report modal
  wireHistRows();
  document.querySelectorAll('[data-open-sim]').forEach(el=>{
    el.onclick = ()=>{ document.getElementById('modalRoot').innerHTML = simModal(el.dataset.openSim); wireSimModal(); };
  });
  document.querySelectorAll('[data-open-learn]').forEach(el=>{
    el.onclick = ()=>{ document.getElementById('modalRoot').innerHTML = learnModal(parseInt(el.dataset.openLearn,10)); wireSimpleModalClose('learnOverlay','learnClose'); };
  });
}
function wireHistRows(){
  document.querySelectorAll('[data-open-report]').forEach(el=>{
    el.onclick = (e)=>{ if(e.target.closest('[data-del-report]')) return; document.getElementById('modalRoot').innerHTML = reportModal(el.dataset.openReport); wireReportModal(); };
  });
  document.querySelectorAll('[data-del-report]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); deleteHistoryItem(el.dataset.delReport); router(); };
  });
}
function wireTree(){
  document.querySelectorAll('[data-tree-go]').forEach(el=>{
    el.onclick = ()=>{ document.getElementById('treeRoot').innerHTML = renderTreeStep(el.dataset.treeGo); wireTree(); };
  });
  const restart = document.getElementById('btnTreeRestart');
  if(restart) restart.onclick = ()=>{ document.getElementById('treeRoot').innerHTML = renderTreeStep(TREE_STEPS[0].key); wireTree(); };
}
function wireSimModal(){
  wireSimpleModalClose('simOverlay','simClose');
  document.querySelectorAll('#simChoices button').forEach(b=>{
    b.onclick = ()=> handleSimChoice(currentSimState.queueId, b.dataset.choice);
  });
  document.addEventListener('click', function handler(e){
    if(e.target && e.target.id==='simCloseBottom'){ document.getElementById('modalRoot').innerHTML=''; document.removeEventListener('click',handler); }
  });
}
function wireReportModal(){
  wireSimpleModalClose('reportOverlay','reportClose');
  const printBtn = document.getElementById('btnPrintReport');
  if(printBtn) printBtn.onclick = ()=> window.print();
  const jsonBtn = document.getElementById('btnExportJson');
  if(jsonBtn) jsonBtn.onclick = ()=>{
    const overlay = document.getElementById('reportOverlay');
    const reportId = overlay ? getHistory().find(h=>overlay.innerHTML.includes(h.id))?.id : null;
    const item = getHistory().find(h=>h.id===reportId) || getHistory()[0];
    const blob = new Blob([JSON.stringify(item.full, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (item.id)+'.json'; a.click();
  };
  const copyBtn = document.getElementById('btnCopyReport');
  if(copyBtn) copyBtn.onclick = ()=>{
    const modal = document.querySelector('#reportOverlay .modal');
    const text = modal.innerText;
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>{ copyBtn.textContent='Copied ✓'; setTimeout(()=>copyBtn.textContent='Copy Summary',1500); });
  };
}
function wireSimpleModalClose(overlayId, closeId){
  const overlay = document.getElementById(overlayId);
  const closeBtn = document.getElementById(closeId);
  if(closeBtn) closeBtn.onclick = ()=>{ document.getElementById('modalRoot').innerHTML=''; };
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) document.getElementById('modalRoot').innerHTML=''; };
}

/* Handle Analyzer report action buttons (print/export/copy) when shown inline, not in modal */
document.addEventListener('click', function(e){
  if(e.target && e.target.id==='btnPrintReport' && !document.getElementById('reportOverlay')) window.print();
  if(e.target && e.target.id==='btnExportJson' && !document.getElementById('reportOverlay') && currentAnalysisState.report){
    const blob = new Blob([JSON.stringify(currentAnalysisState.report, null, 2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = currentAnalysisState.report.id+'.json'; a.click();
  }
  if(e.target && e.target.id==='btnCopyReport' && !document.getElementById('reportOverlay')){
    const text = document.getElementById('analysisResult').innerText;
    if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>{ e.target.textContent='Copied ✓'; setTimeout(()=>e.target.textContent='Copy Summary',1500); });
  }
});

/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
buildNav();
document.getElementById('menuBtn').onclick = ()=>{ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-scrim').classList.toggle('show'); };
document.getElementById('sidebar-scrim').onclick = ()=>{ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('show'); };
document.getElementById('nav').addEventListener('click', (e)=>{
  const link = e.target.closest('.navlink');
});
window.addEventListener('hashchange', router);
router();
</script>
